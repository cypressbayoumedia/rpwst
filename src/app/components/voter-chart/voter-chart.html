<div class="chart-container" #chartSection>
    <div class="donut-wrapper">
        <svg viewBox="0 0 100 100" class="donut">
            <!-- Background ring -->
            <circle cx="50" cy="50" r="40" fill="transparent" stroke="#f0f0f0" stroke-width="12"></circle>

            <!-- Segments -->
            @for (segment of voterData; track segment.label) {
            <circle class="donut-segment" cx="50" cy="50" r="40" fill="transparent" [attr.stroke]="segment.color"
                stroke-width="12" [style.stroke-dasharray]="hasAnimated ? segment.dashArray : '0 ' + circumference"
                [style.stroke-dashoffset]="segment.offset">
            </circle>
            }
        </svg>
        <div class="donut-centered-text">
            <span class="total-number">{{ totalVoters | number }}</span>
            <span class="total-label">Total Voters</span>
        </div>
    </div>

    <div class="legend">
        @for (segment of voterData; track segment.label) {
        <div class="legend-item" [class.is-visible]="hasAnimated" [style.transition-delay]="($index * 150) + 'ms'">
            <div class="legend-left">
                <span class="color-dot" [style.background-color]="segment.color"></span>
                <span class="label">{{ segment.label }}</span>
            </div>
            <div class="legend-right">
                <span class="count">{{ segment.count | number }}</span>
                <span class="percentage">{{ segment.percentage }}%</span>
            </div>
        </div>
        }
    </div>
</div>
